#Server port :
server.port= 8900

# Application name:
spring.application.name= api-gateway

# Eureka:
eureka.client.service-url.defaultZone = http://localhost:8761/eureka

# Gateway routes:
spring.cloud.gateway.routes[0].id= user-service
spring.cloud.gateway.routes[0].uri= http://localhost:8811/
spring.cloud.gateway.routes[0].predicates[0]= Path=/api/accounts/**
spring.cloud.gateway.routes[0].filters[0]= StripPrefix=2

spring.cloud.gateway.routes[1].id= product-catalog-service
spring.cloud.gateway.routes[1].uri= http://localhost:8810/
spring.cloud.gateway.routes[1].predicates[0]= Path=/api/catalog/**
spring.cloud.gateway.routes[1].filters[0]= StripPrefix=2

spring.cloud.gateway.routes[2].id= order-service
spring.cloud.gateway.routes[2].uri= http://localhost:8813/
spring.cloud.gateway.routes[2].predicates[0]= Path=/api/shop/**
spring.cloud.gateway.routes[2].filters[0]= StripPrefix=2

spring.cloud.gateway.routes[3].id= order-service-admin
spring.cloud.gateway.routes[3].uri= http://localhost:8813/
spring.cloud.gateway.routes[3].predicates[0]= Path=/api/admin/**
spring.cloud.gateway.routes[3].filters[0]= StripPrefix=1

spring.cloud.gateway.routes[4].id= notification-service
spring.cloud.gateway.routes[4].uri= http://localhost:8817/
spring.cloud.gateway.routes[4].predicates[0]= Path=/api/notifications/**
spring.cloud.gateway.routes[4].filters[0]= StripPrefix=1

spring.cloud.gateway.routes[5].id= recommendation-service
spring.cloud.gateway.routes[5].uri= http://localhost:8812/
spring.cloud.gateway.routes[5].predicates[0]= Path=/api/review/**
spring.cloud.gateway.routes[5].filters[0]= StripPrefix=2

# Redis for checking blacklisted tokens
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.rainbowforest.apigateway.controller
