#Server port :
server.port= 8900

# Application name:
spring.application.name= api-gateway

# Eureka:
eureka.client.service-url.defaultZone = http://localhost:8761/eureka

# =========================================================
# Rate Limiting (Redis Token Bucket)
# replenish-rate: Số request tối đa được phép mỗi giây (bình thường)
# burst-capacity: Số request tối đa được phép trong một đợt bùng phát
# requested-tokens: Số token tiêu thụ mỗi request (thường = 1)
# =========================================================
spring.cloud.gateway.redis-rate-limiter.replenish-rate=10
spring.cloud.gateway.redis-rate-limiter.burst-capacity=20
spring.cloud.gateway.redis-rate-limiter.requested-tokens=1

spring.cloud.gateway.filter.request-rate-limiter.redis-rate-limiter.replenish-rate=10
spring.cloud.gateway.filter.request-rate-limiter.redis-rate-limiter.burst-capacity=20
spring.cloud.gateway.filter.request-rate-limiter.redis-rate-limiter.requested-tokens=1


# Gateway routes:
spring.cloud.gateway.routes[0].id= user-service
spring.cloud.gateway.routes[0].uri= http://localhost:8811/
spring.cloud.gateway.routes[0].predicates[0]= Path=/api/accounts/**
spring.cloud.gateway.routes[0].filters[0]= StripPrefix=2
spring.cloud.gateway.routes[0].filters[1].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[1].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.routes[0].filters[1].args.rate-limiter=#{@redisRateLimiter}

