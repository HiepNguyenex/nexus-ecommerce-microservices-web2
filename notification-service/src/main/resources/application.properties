server.port=8817
spring.application.name=notification-service

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Database: MySQL (Lab 2 - Câu 2 - thay cho MongoDB)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-hiepweb2-nguyenvuhiep401-b7ce.h.aivencloud.com:19105}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:avnadmin}" password="${KAFKA_SASL_PASSWORD:AVNS_ZlTe0rPhFWbpWPic41k}";
spring.kafka.properties.ssl.truststore.location=d:/Bai Tap/java-project/e-commerce-microservices-master/truststore.jks
spring.kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD:mypassword}
spring.kafka.properties.ssl.truststore.type=JKS
spring.kafka.consumer.group-id=notification-group-v2
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=com.rainbowforest.orderservice.event.OrderCreatedEvent:com.rainbowforest.notificationservice.event.OrderCreatedEvent,com.rainbowforest.paymentservice.event.PaymentCompletedEvent:com.rainbowforest.notificationservice.event.PaymentCompletedEvent,com.rainbowforest.orderservice.event.OrderShippedEvent:com.rainbowforest.notificationservice.event.OrderShippedEvent
