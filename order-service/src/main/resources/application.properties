spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=com.rainbowforest.paymentservice.event.PaymentCompletedEvent:com.rainbowforest.orderservice.event.PaymentCompletedEvent,com.rainbowforest.inventoryservice.event.OrderShippedEvent:com.rainbowforest.orderservice.event.OrderShippedEvent

# Saga: order-service publishes order-shipped topic
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.rainbowforest.orderservice.controller

# =========================================================
# Resilience4j Circuit Breaker Configuration (Tiêu chí 13)
# sliding-window-size: Số request gần nhất để tính failure rate
# failure-rate-threshold: % lỗi để mở circuit (50% = 5/10 request lỗi)
# wait-duration-in-open-state: Thời gian OPEN trước khi thử HALF-OPEN (10s)
# permitted-number-of-calls-in-half-open-state: Số request thử trong HALF-OPEN
# =========================================================

# Circuit Breaker cho product-catalog-service
resilience4j.circuitbreaker.instances.product-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.product-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.product-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.product-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.product-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.product-service.automatic-transition-from-open-to-half-open-enabled=true

# Circuit Breaker cho user-service
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.user-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.user-service.automatic-transition-from-open-to-half-open-enabled=true

# Retry config — thử lại 3 lần trước khi mở circuit
resilience4j.retry.instances.product-service.max-attempts=3
resilience4j.retry.instances.product-service.wait-duration=500ms
resilience4j.retry.instances.user-service.max-attempts=3
resilience4j.retry.instances.user-service.wait-duration=500ms
